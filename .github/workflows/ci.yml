name: CI
on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: latest
      - name: Verifică versiunea Node (>= 24)
        run: node -e "if (+process.versions.node.split('.')[0] < 24) { console.error('Node prea vechi'); process.exit(1) }"
      - run: npm ci
      - run: npm run dicts
      - run: npm test
      - run: npm run build
      - name: Lint manifest Firefox
        run: npx --yes web-ext lint --source-dir dist/firefox --warnings-as-errors=false
      - name: Teste end-to-end (Chromium)
        run: |
          python3 -m pip install --break-system-packages playwright pillow numpy
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.* /etc/apt/sources.list.d/*microsoft*
          python3 -m playwright install --with-deps chromium || python3 -m playwright install chromium
          python3 test/e2e/e2e.py
      - name: Audit adversarial (Chromium)
        env:
          ERATA_LAT_MS: '1500'
        run: python3 test/e2e/audit.py
      - run: npm run pack
      - uses: actions/upload-artifact@v4
        with:
          name: erata-extensions
          path: dist/*.zip
      - name: Publică versiunea (doar pe main, dacă nu există deja)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="v$(node -p "require('./package.json').version")"
          if gh release view "$V" >/dev/null 2>&1; then echo "$V există deja"; exit 0; fi
          awk -v v="${V#v}" '$0 ~ "^## "v {f=1; next} f && /^## / {exit} f' CHANGELOG.md > /tmp/notes.md
          gh release create "$V" dist/*.zip --target "$GITHUB_SHA" --title "ERATA ${V#v}" --notes-file /tmp/notes.md
